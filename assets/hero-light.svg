  <rect x="674" y="108" width="96" height="24" rx="6" fill="#FB4D64"/>
  <text x="722" y="124" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.5" fill="#FFFFFF">CASE NOTE</text>

  <rect x="674" y="146" width="4" height="26" rx="2" fill="#F8FAFC"/>
  <text x="690" y="165" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="19" font-weight="700" fill="#F8FAFC">Inspect the torn case ledger again.</text>

  <rect x="674" y="188" width="4" height="26" rx="2" fill="#38BDF8"/>
  <text x="690" y="207" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="17" font-weight="600" fill="#7DD3FC">破れた事件簿をもう一度確認しよう。</text>

  <line x1="674" y1="242" x2="1128" y2="242" stroke="#1E293B" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600">
    <rect x="674" y="260" width="84" height="32" rx="7" fill="#3B1822" stroke="#FB4D64" stroke-width="1"/>
