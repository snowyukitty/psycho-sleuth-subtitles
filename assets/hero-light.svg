    <rect x="768" y="260" width="92" height="32" rx="7" fill="#0C2D48" stroke="#38BDF8" stroke-width="1"/>
    <text x="814" y="280" text-anchor="middle" fill="#7DD3FC">[2] 日本語</text>
    <rect x="870" y="260" width="86" height="32" rx="7" fill="#1E293B"/>
