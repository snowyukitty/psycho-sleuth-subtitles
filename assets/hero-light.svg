<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Psycho-Sleuth Dual Subtitles (light)</title>
  <desc id="desc">Windows x64 dual-subtitle installer supporting four languages in six pairs and twelve display orders using local Steam game files.</desc>
  <rect x="1" y="1" width="1198" height="358" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="1" y="1" width="10" height="358" rx="5" fill="#FB4D64"/>
  <circle cx="1140" cy="48" r="110" fill="#0284C7" opacity="0.06"/>
  <circle cx="1090" cy="310" r="85" fill="#FB4D64" opacity="0.06"/>

  <g transform="translate(44, 48) scale(0.082031)">
    <rect x="256" y="576" width="704" height="320" rx="64" fill="#0284C7"/>
    <rect x="384" y="672" width="448" height="128" rx="48" fill="#E0F2FE"/>
    <rect x="64" y="128" width="704" height="384" rx="64" fill="#0F172A"/>
    <path d="M128 128H256V512H128C92.654 512 64 483.346 64 448V192C64 156.654 92.654 128 128 128Z" fill="#FB4D64"/>
    <rect x="320" y="256" width="384" height="128" rx="48" fill="#F8FAFC"/>
  </g>

  <rect x="148" y="50" width="276" height="26" rx="13" fill="#FFE4E6"/>
  <text x="286" y="67" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="12" font-weight="700" letter-spacing="0.4" fill="#BE123C">WEB PATCHER (ZERO CMD) · WINDOWS</text>

  <text x="148" y="113" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="30" font-weight="800" fill="#0F172A">Psycho-Sleuth Dual Subtitles</text>

  <text x="48" y="172" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="16" font-weight="500" fill="#475569">Pair any 2 built-in tracks in Edge/Chrome (zero CMD) or offline</text>
  <text x="48" y="198" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="16" font-weight="500" fill="#475569">ZIP — story dialogue, choices &amp; 22 cutscenes. Zero uploads.</text>

  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13" font-weight="600">
    <rect x="48" y="230" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="65" cy="247" r="4.5" fill="#FB4D64"/>
    <text x="78" y="252" fill="#1E293B">Browser Web Patcher</text>

    <rect x="238" y="230" width="198" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="255" cy="247" r="4.5" fill="#0284C7"/>
    <text x="268" y="252" fill="#1E293B">EN · 日本語 · 繁體 · 简体</text>

    <rect x="446" y="230" width="176" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="463" cy="247" r="4.5" fill="#10B981"/>
    <text x="476" y="252" fill="#1E293B">Byte-Exact Restore</text>
  </g>

  <text x="48" y="308" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#64748B">Web: Select Folder → Apply  ·  Offline: Install.cmd / Restore.cmd</text>

  <!-- Right preview card: Dual-track dialogue mock -->
  <rect x="646" y="42" width="510" height="276" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="646" y="42" width="510" height="44" rx="16" fill="#1E293B"/>
  <rect x="646" y="70" width="510" height="16" fill="#1E293B"/>
  <circle cx="670" cy="64" r="5" fill="#EF4444"/>
  <circle cx="688" cy="64" r="5" fill="#F59E0B"/>
  <circle cx="706" cy="64" r="5" fill="#10B981"/>
  <text x="726" y="68" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#94A3B8">SUBTITLE TRACK PREVIEW</text>
  <rect x="1032" y="52" width="106" height="24" rx="6" fill="#0C2D48"/>
