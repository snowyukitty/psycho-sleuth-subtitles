  <text x="353" y="113" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="800" fill="#FFFFFF">02</text>
  <text x="380" y="114" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="16" font-weight="800" fill="#F0F6FC">Journaled Backup</text>
  <text x="336" y="158" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Save verified originals into</text>
  <text x="336" y="181" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">.psycho-sleuth-subtitles/original</text>
  <text x="336" y="204" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Write staged transaction journal</text>
  <text x="336" y="227" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Reuse clean backups on switch</text>
  <path d="M586 173H600M596 167L603 173L596 179" stroke="#8B949E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
