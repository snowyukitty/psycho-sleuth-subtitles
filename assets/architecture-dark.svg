<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="304" viewBox="0 0 1200 304" role="img" aria-labelledby="title desc">
  <title id="title">Psycho-Sleuth Dual Subtitles Patch Pipeline (dark)</title>
  <desc id="desc">Four-stage transactional workflow: preflight verification, journaled backup, local asset merge preserving voice cells, and exact restore.</desc>
  <rect x="1" y="1" width="1198" height="302" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <text x="28" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="18" font-weight="800" fill="#F0F6FC">How the Safe Patch &amp; Restore Pipeline Works</text>
  <text x="1172" y="44" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#8B949E">LOCAL-ONLY · FAIL-CLOSED · REVERSIBLE</text>
  <rect x="28" y="74" width="264" height="198" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="28" y="74" width="264" height="6" rx="3" fill="#FB4D64"/>
