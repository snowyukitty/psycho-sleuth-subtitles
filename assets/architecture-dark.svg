  <text x="63" y="113" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="800" fill="#FFFFFF">01</text>
  <text x="90" y="114" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="16" font-weight="800" fill="#F0F6FC">Preflight &amp; Lock</text>
  <text x="46" y="158" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Verify supported-build.json</text>
  <text x="46" y="181" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Check runtime &amp; asset hashes</text>
  <text x="46" y="204" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Confirm game is closed; fetch</text>
  <text x="46" y="227" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">SHA-256 Python 3.14.10 (~12 MB)</text>
