  <text x="670" y="114" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="16" font-weight="800" fill="#F0F6FC">Script &amp; Video Merge</text>
  <text x="626" y="158" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Patch story dialogue &amp; branching</text>
  <text x="626" y="181" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">choices; align localized tables</text>
  <text x="626" y="204" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Merge 22 .srt sets &amp; UI sizing</text>
  <text x="626" y="227" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Preserve voice &amp; control cells</text>
  <path d="M876 173H890M886 167L893 173L886 179" stroke="#8B949E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="898" y="74" width="264" height="198" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="898" y="74" width="264" height="6" rx="3" fill="#10B981"/>
  <rect x="916" y="96" width="34" height="24" rx="6" fill="#10B981"/>
  <text x="933" y="113" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="800" fill="#FFFFFF">04</text>
  <text x="960" y="114" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="16" font-weight="800" fill="#F0F6FC">Switch or Restore</text>
  <text x="916" y="158" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Commit SHA-256 receipt on success</text>
  <text x="916" y="181" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Re-run Install.cmd to swap pair or</text>
  <text x="916" y="204" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">reverse top/bottom order anytime</text>
  <text x="916" y="227" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', sans-serif" font-size="13.5" fill="#9CA3AF">Run Restore.cmd for byte-exact exit</text>
</svg>
